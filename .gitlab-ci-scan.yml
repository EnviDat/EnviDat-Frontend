# GHSA-gv7w-rqvm-qjhr is pulled via vuetify -> vite-plugin-vuetify -> vite.
# vite-plugin-vuetify is build tooling used in vite.config.ts and is not shipped as runtime app code.
verify-node-audit:
  stage: test
  image: node:lts-alpine
  environment: $CI_COMMIT_REF_NAME
  extends: .normal-rules
  needs:
    - job: modify-env
      artifacts: false
  script:
    - apk add --no-cache jq
    - npm ci --prefer-offline --no-audit --no-fund --loglevel=error
    - npm audit --audit-level=high --omit=dev --json > npm-audit.json || true
    - |
      HIGH_OR_CRITICAL=$(jq '
        [.vulnerabilities
        | to_entries[]
        | select(.value.severity == "high" or .value.severity == "critical")
        | select(.value.via | tostring | contains("GHSA-gv7w-rqvm-qjhr") | not)]
        | length
      ' npm-audit.json)

      if [ "$HIGH_OR_CRITICAL" -gt 0 ]; then
        cat npm-audit.json
        echo "npm audit failed: found $HIGH_OR_CRITICAL high/critical vulnerabilities."
        exit 1
      fi

      echo "npm audit passed. Ignored accepted esbuild/vite build-tool finding GHSA-gv7w-rqvm-qjhr."
  retry:
    max: 2

verify-node-owasp:
  stage: test
  image: owasp/dependency-check:latest
  environment: $CI_COMMIT_REF_NAME
  rules:
    - when: manual
  # for manual jobs add allow_failure so the whole pipeline won't show up as "blocked"
  allow_failure: true
  needs:
    - job: modify-env
      artifacts: false
  script:
    # dependency check against the National Vulnerability Database
    # https://dependency-check.github.io/DependencyCheck/
    # more about the cli commands https://dependency-check.github.io/DependencyCheck/dependency-check-cli/arguments.html
    - >
      sh /usr/dependency-check/bin/dependency-check.sh \
      --project "EnviDat-Frontend" \
      --scan "." \
      --out "reports" \
      --format "HTML" \
      --format "JSON" \
      --failOnCVSS 7 \
      --exclude "**/node_modules/**" \
      --enableExperimental \
      --enableRetired \
      --nvdApiKey "$NVD_API_KEY"
  artifacts:
    paths:
      - reports
  retry:
    max: 2
